<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hangulatnaplo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"/>
    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body>
    <!-- nav -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Hangulatnapló</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavigation"
          aria-controls="mainNavigation"
          aria-expanded="false"
          aria-label="Navigáció megnyitása">

          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavigation">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="index.html">Új bejegyzés</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="admin.html">Bejegyzések</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="statisztikak.html">Statisztikák</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">

      <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-7">
          <section class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">

              <p class="text-primary fw-bold small text-uppercase mb-2">Napi napló</p>
              <h1 class="h2 mb-2">Új bejegyzes</h1>
              <p class="text-secondary mb-4">Írd le röviden hogyan telt a napod</p>

              <div id="message" aria-live="polite"></div>
              <form id="entryForm" novalidate>

                <div class="mb-4">
                  <label for="description" class="form-label fw-semibold">Szöveges leírás</label>

                  <textarea
                    id="description"
                    class="form-control"
                    rows="6"
                    maxlength="500"
                    placeholder="Például: Ma nagyon jó napom volt."
                    required></textarea>
                  <div class="form-text">Maximum 500 karakter</div>
                </div>

                <button id="saveButton" type="submit" class="btn btn-primary px-4">
                  Bejegyzés mentese
                </button>

              </form>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
